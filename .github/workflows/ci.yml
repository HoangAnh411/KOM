name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly recovery drill, matching the cadence the operations runbook asks for.
    - cron: "7 3 2 * *"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kingdoms
          POSTGRES_USER: kingdoms
          POSTGRES_PASSWORD: kingdoms
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U kingdoms -d kingdoms"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: gate 1 - npm ci
        run: npm ci

      - name: create kingdoms_test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=kingdoms psql -h localhost -U kingdoms -d postgres -c 'CREATE DATABASE kingdoms_test;'

      - name: gate 2 - migration 001-latest on a fresh database
        run: DATABASE_URL=postgres://kingdoms:kingdoms@localhost:5432/kingdoms_test npm run db:migrate

      - name: gate 3 - migrations are idempotent (second run) and checksums match
        run: |
          DATABASE_URL=postgres://kingdoms:kingdoms@localhost:5432/kingdoms_test npm run db:migrate
          DATABASE_URL=postgres://kingdoms:kingdoms@localhost:5432/kingdoms_test npm run db:migrate:check

      - name: gate 4 - typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: gate 5 - PostgreSQL restart/multi-instance integration
        run: TEST_DATABASE_URL=postgres://kingdoms:kingdoms@localhost:5432/kingdoms_test TEST_REDIS_URL=redis://localhost:6379 npm run test:postgres

      - name: gate 6 - unit and regression tests
        run: npm test

      - name: gate 7 - Playwright Chromium desktop (Phase 7C)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: gate 8 - client chunk sizes within 500 KiB
        run: npm run check:bundle

      - name: gate 9 - git diff --check
        run: git diff --check

      # Last on purpose: an advisory published after the commit must not hide a code failure.
      - name: gate 10 - npm audit --audit-level=high
        run: npm audit --audit-level=high

  # Everything below needs Docker, so it is kept out of the per-commit gate. `verify:web-beta`
  # = the ten gates above + this job.
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Real prod compose (Caddy TLS + PG + Redis + game + outbox): register -> build -> reload
      # keeps the session, and /health/ready, /metrics, /api/dev/* must answer 404 from outside.
      - name: prod smoke (password auth over prod compose)
        run: npm run test:prod-smoke

  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Redis kill, game kill with the outbox surviving alone, backup -> drop -> restore with a
      # sentinel row. Writes infra/backup/drill-report.md, so this job never runs git diff --check.
      - name: recovery drill
        run: npm run drill:web-beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drill-report
          path: infra/backup/drill-report.md
