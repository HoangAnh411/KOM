name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kingdoms
          POSTGRES_USER: kingdoms
          POSTGRES_PASSWORD: kingdoms
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U kingdoms -d kingdoms"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
