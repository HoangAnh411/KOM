services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kingdoms
      POSTGRES_USER: kingdoms
      POSTGRES_PASSWORD: kingdoms
    ports:
      - "5432:5432"
    volumes:
      - kingdoms-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  kingdoms-postgres:
