global:
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kingdoms-game
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/bearer.token
    static_configs:
      - targets: ["game:3000"]
  - job_name: kingdoms-outbox
    metrics_path: /metrics
    static_configs:
      - targets: ["outbox:9101"]
